<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Timer</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏳</text></svg>">



    <style>
        :root {
            --dark: #111111;
            --light: #F0E8D5;

            --light-soft: rgba(240, 232, 213, 0.12);
            --light-border: rgba(240, 232, 213, 0.28);
            --light-muted: rgba(240, 232, 213, 0.65);
        }


        /* ==================================================
           ОСНОВА
           ================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 24px;

            background: var(--dark);
            color: var(--light);

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }


        /* ==================================================
           ОСНОВНОЙ КОНТЕЙНЕР
           ================================================== */

        .timer {
            width: min(520px, 100%);
        }


        /* ==================================================
           ОСНОВНОЕ ВРЕМЯ
           ================================================== */

        .time {
            margin-bottom: 28px;

            font-size: clamp(58px, 16vw, 108px);
            font-weight: 500;
            line-height: 1;

            letter-spacing: 0.035em;

            text-align: center;

            font-variant-numeric: tabular-nums;
            user-select: none;
        }


        .end-time {
            min-height: 20px;

            margin-top: -18px;
            margin-bottom: 20px;

            color: var(--light-muted);

            font-size: 12px;
            text-align: center;

            font-variant-numeric: tabular-nums;

            opacity: 0;

            transition: opacity 0.15s ease;
        }

        .end-time.visible {
            opacity: 1;
        }


        /* ==================================================
           ПУЛЬСАЦИЯ ПОСЛЕДНИХ 10 СЕКУНД
           ================================================== */

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .time.warning {
            animation: pulse 1s ease-in-out infinite;
        }


        /* ==================================================
           СТРОКА ПОЛЕЙ + КНОПКА +10 СЕК
           ================================================== */

        .time-input-row {
            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                auto;

            gap: 8px;

            align-items: end;

            margin-bottom: 16px;
        }


        /* ==================================================
           ВВОД ВРЕМЕНИ
           ================================================== */

        .inputs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 10px;
        }

        .input-group {
            display: flex;
            flex-direction: column;

            gap: 6px;
        }

        .input-label {
            color: var(--light-muted);

            font-size: 12px;
            text-align: center;
        }

        input {
            width: 100%;

            padding: 11px 8px;

            border: 1px solid var(--light-border);
            border-radius: 8px;

            outline: none;

            background: transparent;
            color: var(--light);

            font-size: 18px;
            text-align: center;

            transition:
                background 0.15s ease,
                border-color 0.15s ease,
                color 0.15s ease;
        }

        input:focus {
            border-color: var(--light);

            background: var(--light);
            color: var(--dark);
        }

        input::-webkit-inner-spin-button,
        input::-webkit-outer-spin-button {
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }


        /* ==================================================
           +10 СЕК

           Маленькая второстепенная кнопка.
           ================================================== */

        .add-seconds {
            min-height: 44px;

            padding: 8px 10px;

            border: 1px solid var(--light-border);
            border-radius: 7px;

            background: transparent;
            color: var(--light-muted);

            cursor: pointer;

            white-space: nowrap;

            font-size: 13px;
            font-variant-numeric: tabular-nums;

            transition:
                background 0.15s ease,
                border-color 0.15s ease,
                color 0.15s ease,
                transform 0.08s ease;
        }

        .add-seconds:hover {
            border-color: var(--light);
            background: var(--light-soft);
            color: var(--light);

            transform: translateY(-1px);
        }

        .add-seconds:active {
            transform: translateY(1px);
        }

        .add-seconds:disabled {
            opacity: 0.35;

            cursor: default;

            transform: none;
        }


        /* ==================================================
           ОСНОВНЫЕ КНОПКИ
           ================================================== */

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;

            gap: 10px;

            margin-bottom: 26px;
        }

        .button {
            min-height: 46px;

            padding: 10px 14px;

            border: 1px solid var(--light-border);
            border-radius: 8px;

            background: transparent;
            color: var(--light);

            cursor: pointer;

            transition:
                background 0.15s ease,
                border-color 0.15s ease,
                color 0.15s ease,
                transform 0.08s ease;
        }

        .button:hover {
            border-color: var(--light);
            background: var(--light-soft);

            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(1px);
        }

        .button.primary {
            border-color: var(--light);

            background: var(--light);
            color: var(--dark);
        }

        .button.primary:hover {
            background: transparent;
            color: var(--light);
        }


        /* ==================================================
           ПРЕСЕТЫ
           ================================================== */

        .templates {
            padding-top: 20px;

            border-top: 1px solid var(--light-border);
        }

        .templates-title {
            margin-bottom: 12px;

            color: var(--light-muted);

            font-size: 12px;
            letter-spacing: 0.08em;

            text-align: center;
            text-transform: uppercase;
        }

        .template-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 8px;
        }

        .template {
            padding: 10px 8px;

            border: 1px solid var(--light-border);
            border-radius: 7px;

            background: transparent;
            color: var(--light);

            cursor: pointer;

            font-variant-numeric: tabular-nums;

            transition:
                background 0.15s ease,
                border-color 0.15s ease,
                color 0.15s ease,
                transform 0.08s ease;
        }

        .template:hover {
            border-color: var(--light);
            background: var(--light-soft);

            transform: translateY(-1px);
        }

        .template:active {
            transform: translateY(1px);
        }

        .template.active {
            border-color: var(--light);
            background: var(--light-soft);
        }


        /* ==================================================
           СООБЩЕНИЕ
           ================================================== */

        .message {
            min-height: 22px;

            margin-top: 18px;

            color: var(--light-muted);

            font-size: 13px;
            text-align: center;
        }


        /* ==================================================
           МОДАЛЬНОЕ ОКНО
           ================================================== */

        .modal {
            position: fixed;
            inset: 0;

            z-index: 100;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 24px;

            background: rgba(17, 17, 17, 0.82);

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.2s ease,
                visibility 0.2s ease;
        }

        .modal.visible {
            opacity: 1;
            visibility: visible;
        }

        .modal-window {
            width: min(380px, 100%);

            padding: 32px 24px 24px;

            border: 1px solid var(--light-border);
            border-radius: 12px;

            background: var(--dark);

            text-align: center;

            transform: translateY(8px);

            transition:
                transform 0.2s ease;
        }

        .modal.visible .modal-window {
            transform: translateY(0);
        }

        .modal-title {
            margin-bottom: 10px;

            font-size: 26px;
            font-weight: 500;
        }

        .modal-text {
            margin-bottom: 10px;

            color: var(--light-muted);

            font-size: 14px;
        }

        .modal-hint {
            margin-bottom: 24px;

            color: var(--light-muted);

            font-size: 12px;
            opacity: 0.8;
        }

        .modal-button {
            width: 100%;
        }


        /* ==================================================
           АДАПТАЦИЯ
           ================================================== */

        @media (max-width: 480px) {

            body {
                padding: 18px;
            }

            .time {
                margin-bottom: 24px;

                font-size:
                    clamp(48px, 17vw, 78px);
            }

            /*
             * На узком экране кнопка остаётся справа,
             * но становится ещё компактнее.
             */

            .add-seconds {
                padding-left: 8px;
                padding-right: 8px;

                font-size: 12px;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .template-list {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>


<body>

    <main class="timer">

        <!-- =================================================
             ОСНОВНОЕ ВРЕМЯ
             ================================================= -->

        <div
            id="time"
            class="time"
            aria-live="polite"
        >
            00:06:30
        </div>


        <div
            id="endTime"
            class="end-time"
            aria-live="polite"
        ></div>


        <!-- =================================================
             ПОЛЯ ВРЕМЕНИ +10 СЕК
             ================================================= -->

        <div class="time-input-row">

            <div class="inputs">

                <div class="input-group">

                    <label
                        class="input-label"
                        for="hours"
                    >
                        Часы
                    </label>

                    <input
                        id="hours"
                        type="number"
                        min="0"
                        max="99"
                        value="0"
                        inputmode="numeric"
                        aria-label="Часы"
                    >

                </div>


                <div class="input-group">

                    <label
                        class="input-label"
                        for="minutes"
                    >
                        Минуты
                    </label>

                    <input
                        id="minutes"
                        type="number"
                        min="0"
                        max="999"
                        value="6"
                        inputmode="numeric"
                        aria-label="Минуты"
                    >

                </div>


                <div class="input-group">

                    <label
                        class="input-label"
                        for="seconds"
                    >
                        Секунды
                    </label>

                    <input
                        id="seconds"
                        type="number"
                        min="0"
                        max="59"
                        value="30"
                        inputmode="numeric"
                        aria-label="Секунды"
                    >

                </div>

            </div>


            <button
                id="addSecondsButton"
                class="add-seconds"
                type="button"
                title="Добавить 10 секунд"
            >
                +10 сек
            </button>

        </div>


        <!-- =================================================
             ОСНОВНЫЕ КНОПКИ
             ================================================= -->

        <div class="controls">

            <button
                id="startButton"
                class="button primary"
                type="button"
            >
                Старт
            </button>

            <button
                id="pauseButton"
                class="button"
                type="button"
            >
                Пауза
            </button>

            <button
                id="resetButton"
                class="button"
                type="button"
            >
                СТОП
            </button>

        </div>


        <!-- =================================================
             ШАБЛОНЫ ВРЕМЕНИ
             ================================================= -->

        <section class="templates">

            <div class="templates-title">
                Быстрый выбор
            </div>

            <div
                id="templateList"
                class="template-list"
            ></div>

        </section>


        <!-- =================================================
             СООБЩЕНИЕ
             ================================================= -->

        <div
            id="message"
            class="message"
            aria-live="polite"
        ></div>

    </main>


    <!-- =====================================================
         МОДАЛЬНОЕ ОКНО
         ===================================================== -->

    <div
        id="alarmModal"
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="alarmTitle"
    >

        <div class="modal-window">

            <div
                id="alarmTitle"
                class="modal-title"
            >
                Время вышло
            </div>

            <div class="modal-text">
                Таймер завершён.
            </div>

            <div class="modal-hint">
                Enter / Пробел / Esc — завершить
            </div>

            <button
                id="dismissAlarmButton"
                class="button primary modal-button"
                type="button"
            >
                Завершить
            </button>

        </div>

    </div>


    <script>
        "use strict";


        /* ==================================================
           ЭЛЕМЕНТЫ
           ================================================== */

        const timeElement =
            document.getElementById("time");

        const endTimeElement =
            document.getElementById("endTime");

        const hoursInput =
            document.getElementById("hours");

        const minutesInput =
            document.getElementById("minutes");

        const secondsInput =
            document.getElementById("seconds");

        const addSecondsButton =
            document.getElementById(
                "addSecondsButton"
            );

        const startButton =
            document.getElementById("startButton");

        const pauseButton =
            document.getElementById("pauseButton");

        const resetButton =
            document.getElementById("resetButton");

        const messageElement =
            document.getElementById("message");

        const templateList =
            document.getElementById("templateList");

        const alarmModal =
            document.getElementById("alarmModal");

        const dismissAlarmButton =
            document.getElementById(
                "dismissAlarmButton"
            );


        /* ==================================================
           ШАБЛОНЫ ВРЕМЕНИ

           ⭐ РЕДАКТИРУЙ ЗДЕСЬ ⭐

           Можно добавлять, удалять и менять значения.

           Форматы:

               "6:30"
               "10:00"
               "1:30:00"
           ================================================== */

        const TIMER_TEMPLATES = [
            "5:00",
            "6:30",
            "10:00",
            "18:00",
            "20:00",
            "30:00"
        ];


        /* ==================================================
           СОСТОЯНИЕ
           ================================================== */

        let remaining = 0;

        let endTime = null;

        let isAlarmActive = false;

        let audioContext = null;

        let wakeLockSentinel = null;

        let fallbackTickId = null;

        let fallbackBeepId = null;


        /* ==================================================
           WEB WORKER
           ================================================== */

        function createTicker() {

            const workerSource = `
                const timers = {};

                self.onmessage = event => {

                    const data = event.data;

                    if (data.cmd === "start") {

                        clearInterval(
                            timers[data.name]
                        );

                        timers[data.name] =
                            setInterval(
                                () => {
                                    self.postMessage(
                                        data.name
                                    );
                                },
                                data.interval
                            );
                    }

                    if (data.cmd === "stop") {

                        clearInterval(
                            timers[data.name]
                        );

                        delete timers[data.name];
                    }
                };
            `;


            try {

                const blob =
                    new Blob(
                        [workerSource],
                        {
                            type:
                                "application/javascript"
                        }
                    );

                return new Worker(
                    URL.createObjectURL(blob)
                );

            } catch (error) {

                return null;
            }
        }


        const ticker =
            createTicker();


        /* ==================================================
           ТИКЕР
           ================================================== */

        function startTicking() {

            if (ticker) {

                ticker.postMessage({
                    cmd: "start",
                    name: "tick",
                    interval: 250
                });

            } else {

                clearInterval(
                    fallbackTickId
                );

                fallbackTickId =
                    setInterval(
                        updateTimer,
                        250
                    );
            }
        }


        function stopTicking() {

            if (ticker) {

                ticker.postMessage({
                    cmd: "stop",
                    name: "tick"
                });

            } else {

                clearInterval(
                    fallbackTickId
                );

                fallbackTickId = null;
            }
        }


        /* ==================================================
           ПОВТОР СИГНАЛА
           ================================================== */

        function startBeeping() {

            if (ticker) {

                ticker.postMessage({
                    cmd: "start",
                    name: "beep",
                    interval: 1000
                });

            } else {

                clearInterval(
                    fallbackBeepId
                );

                fallbackBeepId =
                    setInterval(
                        playAlarmSound,
                        1000
                    );
            }
        }


        function stopBeeping() {

            if (ticker) {

                ticker.postMessage({
                    cmd: "stop",
                    name: "beep"
                });

            } else {

                clearInterval(
                    fallbackBeepId
                );

                fallbackBeepId = null;
            }
        }


        /* ==================================================
           WAKE LOCK
           ================================================== */

        async function acquireWakeLock() {

            if (
                !("wakeLock" in navigator)
            ) {
                return;
            }

            try {

                wakeLockSentinel =
                    await navigator.wakeLock.request(
                        "screen"
                    );

                wakeLockSentinel.addEventListener(
                    "release",
                    () => {
                        wakeLockSentinel = null;
                    }
                );

            } catch (error) {

                wakeLockSentinel = null;
            }
        }


        function releaseWakeLock() {

            if (wakeLockSentinel) {

                wakeLockSentinel.release();

                wakeLockSentinel = null;
            }
        }


        /* ==================================================
           ФОРМАТ ВРЕМЕНИ
           ================================================== */

        function formatTime(milliseconds) {

            const totalSeconds =
                Math.max(
                    0,
                    Math.ceil(
                        milliseconds / 1000
                    )
                );

            const hours =
                Math.floor(
                    totalSeconds / 3600
                );

            const minutes =
                Math.floor(
                    (totalSeconds % 3600) / 60
                );

            const seconds =
                totalSeconds % 60;


            return [
                String(hours).padStart(2, "0"),
                String(minutes).padStart(2, "0"),
                String(seconds).padStart(2, "0")
            ].join(":");
        }


        function updateEndTimeDisplay() {
            if (endTime === null) {
                endTimeElement.textContent = "";
                endTimeElement.classList.remove("visible");

                return;
            }

            const endDate = new Date(endTime);

            const time = endDate.toLocaleTimeString(
                "ru-RU",
                {
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit"
                }
            );

            endTimeElement.textContent =
                `➤ до [${time}]`;

            endTimeElement.classList.add("visible");
        }


        /* ==================================================
           ОБНОВЛЕНИЕ DISPLAY
           ================================================== */

        function updateDisplay() {

            timeElement.textContent =
                formatTime(remaining);


            /*
             * Пульсация только последних 10 секунд.
             */

            const isWarning =
                endTime !== null &&
                remaining > 0 &&
                remaining <= 10000;

            timeElement.classList.toggle(
                "warning",
                isWarning
            );


            updateEndTimeDisplay();

            syncActiveTemplate();
        }


        /* ==================================================
           INPUT → MILLISECONDS
           ================================================== */

        function getInputDuration() {

            const hours =
                Math.max(
                    0,
                    Number(hoursInput.value) || 0
                );

            const minutes =
                Math.max(
                    0,
                    Number(minutesInput.value) || 0
                );

            const seconds =
                Math.max(
                    0,
                    Number(secondsInput.value) || 0
                );


            return (
                hours * 3600000 +
                minutes * 60000 +
                seconds * 1000
            );
        }


        /* ==================================================
           MILLISECONDS → INPUT
           ================================================== */

        function setInputsFromMilliseconds(
            milliseconds
        ) {

            const totalSeconds =
                Math.max(
                    0,
                    Math.floor(
                        milliseconds / 1000
                    )
                );


            const hours =
                Math.floor(
                    totalSeconds / 3600
                );

            const minutes =
                Math.floor(
                    (totalSeconds % 3600) / 60
                );

            const seconds =
                totalSeconds % 60;


            hoursInput.value = hours;
            minutesInput.value = minutes;
            secondsInput.value = seconds;
        }


        /* ==================================================
           NORMALIZATION INPUT
           ================================================== */

        function normalizeInput(input) {

            if (
                input.value.trim() === ""
            ) {
                input.value = "0";
                return;
            }


            let value =
                Number(input.value);


            if (
                !Number.isFinite(value) ||
                value < 0
            ) {
                value = 0;
            }


            if (input === hoursInput) {
                value = Math.min(
                    value,
                    99
                );
            }


            if (input === minutesInput) {
                value = Math.min(
                    value,
                    999
                );
            }


            if (input === secondsInput) {
                value = Math.min(
                    value,
                    59
                );
            }


            input.value =
                String(
                    Math.floor(value)
                );
        }


        /* ==================================================
           PARSE ШАБЛОНА
           ================================================== */

        function parseTimeString(value) {

            const parts =
                value
                    .split(":")
                    .map(Number);


            if (
                parts.length < 2 ||
                parts.length > 3 ||
                parts.some(
                    part =>
                        !Number.isFinite(part)
                )
            ) {
                return 0;
            }


            let hours = 0;
            let minutes = 0;
            let seconds = 0;


            if (parts.length === 2) {

                minutes = parts[0];
                seconds = parts[1];

            } else {

                hours = parts[0];
                minutes = parts[1];
                seconds = parts[2];
            }


            if (
                hours < 0 ||
                minutes < 0 ||
                seconds < 0 ||
                minutes >= 60 ||
                seconds >= 60
            ) {
                return 0;
            }


            return (
                hours * 3600000 +
                minutes * 60000 +
                seconds * 1000
            );
        }


        /* ==================================================
           ШАБЛОНЫ
           ================================================== */

        function createTemplates() {

            templateList.innerHTML = "";


            TIMER_TEMPLATES.forEach(
                template => {

                    const duration =
                        parseTimeString(
                            template
                        );


                    if (duration <= 0) {
                        return;
                    }


                    const button =
                        document.createElement(
                            "button"
                        );


                    button.type = "button";

                    button.className =
                        "template";

                    button.textContent =
                        template;

                    button.dataset.duration =
                        String(duration);


                    button.addEventListener(
                        "click",
                        () => {

                            /*
                             * Шаблон всегда создаёт
                             * новое подготовленное время.
                             */

                            finishAlarm();

                            stopTicking();

                            releaseWakeLock();

                            endTime = null;

                            remaining =
                                duration;


                            setInputsFromMilliseconds(
                                duration
                            );


                            updateDisplay();

                            messageElement
                                .textContent = "";
                        }
                    );


                    templateList.appendChild(
                        button
                    );
                }
            );
        }


        /* ==================================================
           АКТИВНЫЙ ШАБЛОН
           ================================================== */

        function syncActiveTemplate() {

            const currentDuration =
                getInputDuration();


            document
                .querySelectorAll(
                    ".template"
                )
                .forEach(
                    button => {

                        button.classList.toggle(
                            "active",
                            Number(
                                button.dataset.duration
                            ) === currentDuration
                        );
                    }
                );
        }


        /* ==================================================
           AUDIO
           ================================================== */

        function initializeAudio() {

            if (!audioContext) {

                const AudioContext =
                    window.AudioContext ||
                    window.webkitAudioContext;


                if (!AudioContext) {
                    return;
                }


                audioContext =
                    new AudioContext();
            }


            if (
                audioContext.state ===
                "suspended"
            ) {

                audioContext.resume();
            }
        }


        /* ==================================================
           ЗВУК
           ================================================== */

        function playAlarmSound() {

            if (!audioContext) {
                initializeAudio();
            }


            if (!audioContext) {
                return;
            }


            if (
                audioContext.state ===
                "suspended"
            ) {

                audioContext.resume();
            }


            const now =
                audioContext.currentTime;


            const oscillator =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();


            oscillator.type = "sine";


            oscillator.frequency.setValueAtTime(
                880,
                now
            );

            oscillator.frequency.setValueAtTime(
                660,
                now + 0.12
            );


            gain.gain.setValueAtTime(
                0.0001,
                now
            );

            gain.gain.exponentialRampToValueAtTime(
                0.28,
                now + 0.02
            );

            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                now + 0.35
            );


            oscillator.connect(gain);

            gain.connect(
                audioContext.destination
            );


            oscillator.start(now);

            oscillator.stop(
                now + 0.4
            );
        }


        /* ==================================================
           ALARM
           ================================================== */

        function startAlarm() {

            if (isAlarmActive) {
                return;
            }


            isAlarmActive = true;


            alarmModal.classList.add(
                "visible"
            );


            messageElement.textContent =
                "";


            playAlarmSound();

            startBeeping();


            requestAnimationFrame(
                () => {
                    dismissAlarmButton.focus();
                }
            );
        }


        function stopAlarm() {

            stopBeeping();

            isAlarmActive = false;

            alarmModal.classList.remove(
                "visible"
            );
        }


        /* ==================================================
           ПОЛНОЕ ЗАВЕРШЕНИЕ
           ================================================== */

        function finishAlarm() {

            /*
             * Останавливаем сигнал.
             */

            stopAlarm();


            /*
             * Останавливаем сам таймер.
             */

            stopTicking();

            releaseWakeLock();


            /*
             * Полностью обнуляем состояние.
             */

            endTime = null;
            remaining = 0;


            /*
             * Принудительно показываем 00:00:00.
             */

            updateDisplay();


            messageElement.textContent =
                "Таймер завершён";
        }


        /* ==================================================
           ОКОНЧАНИЕ ОТСЧЁТА
           ================================================== */

        function finishTimer() {

            stopTicking();

            releaseWakeLock();


            endTime = null;
            remaining = 0;


            updateDisplay();

            startAlarm();
        }


        /* ==================================================
           ОБНОВЛЕНИЕ ТАЙМЕРА
           ================================================== */

        function updateTimer() {

            if (endTime === null) {
                return;
            }


            remaining =
                endTime - Date.now();


            if (remaining <= 0) {

                finishTimer();

                return;
            }


            updateDisplay();
        }


        /* ==================================================
           +10 СЕКУНД
           ==================================================

           Поведение:

           ДО ЗАПУСКА:
               remaining += 10 сек

           ВО ВРЕМЯ ОТСЧЁТА:
               endTime += 10 сек

           НА ПАУЗЕ:
               remaining += 10 сек

           При активном alarm ничего автоматически
           не запускаем.
           ================================================== */

        function addTenSeconds() {

            /*
             * Во время сигнала не вмешиваемся
             * в состояние завершённого таймера.
             */

            if (isAlarmActive) {
                return;
            }


            /*
             * ТАЙМЕР ИДЁТ
             *
             * Добавляем 10 секунд непосредственно
             * к моменту окончания.
             */

            if (endTime !== null) {

                endTime += 10000;

                remaining =
                    endTime - Date.now();

                updateDisplay();

                return;
            }


            /*
             * ТАЙМЕР НЕ ИДЁТ
             *
             * Добавляем 10 секунд к подготовленному
             * или поставленному на паузу времени.
             */

            remaining += 10000;


            /*
             * Не допускаем отрицательных значений.
             */

            remaining =
                Math.max(
                    0,
                    remaining
                );


            /*
             * Переносим новое время обратно
             * в поля.
             */

            setInputsFromMilliseconds(
                remaining
            );


            updateDisplay();

            messageElement.textContent =
                "";
        }


        /* ==================================================
           СТАРТ
           ==================================================

           ВСЕГДА НОВЫЙ ЗАПУСК.

           Значение берётся непосредственно
           из текущих полей времени.
           ================================================== */

        function startTimer() {

            /*
             * Если сигнал ещё активен,
             * полностью его прекращаем.
             */

            if (isAlarmActive) {
                stopAlarm();
            }


            /*
             * Убираем возможный старый ticker
             * и Wake Lock.
             */

            stopTicking();

            releaseWakeLock();


            /*
             * Берём время заново из полей.
             */

            const duration =
                getInputDuration();


            if (duration <= 0) {

                endTime = null;
                remaining = 0;

                updateDisplay();

                messageElement.textContent =
                    "Укажи время больше нуля";

                return;
            }


            /*
             * Новый полный запуск.
             */

            remaining = duration;

            endTime =
                Date.now() + duration;


            initializeAudio();

            startTicking();

            acquireWakeLock();


            messageElement.textContent =
                "";


            updateTimer();
        }


        /* ==================================================
           ПАУЗА
           ================================================== */

        function pauseTimer() {

            if (endTime === null) {
                return;
            }


            remaining =
                Math.max(
                    0,
                    endTime - Date.now()
                );


            endTime = null;


            stopTicking();

            releaseWakeLock();


            updateDisplay();


            messageElement.textContent =
                "Пауза";
        }


        /* ==================================================
           СТОП
           ================================================== */

        function resetTimer() {

            stopAlarm();

            stopTicking();

            releaseWakeLock();


            endTime = null;


            remaining =
                getInputDuration();


            updateDisplay();


            messageElement.textContent =
                "";
        }


        /* ==================================================
           INPUT
           ================================================== */

        [
            hoursInput,
            minutesInput,
            secondsInput
        ].forEach(
            input => {

                input.addEventListener(
                    "input",
                    () => {

                        /*
                         * Рабочий таймер не зависит
                         * от изменения полей.
                         */

                        if (endTime !== null) {
                            return;
                        }


                        /*
                         * Определяем максимальную длину.

                         * Часы    → 2
                         * Минуты  → 3
                         * Секунды → 2
                         */

                        const maxDigits =
                            input === hoursInput
                                ? 2
                                : input === minutesInput
                                    ? 3
                                    : 2;


                        /*
                         * Только цифры.
                         */

                        input.value =
                            input.value.replace(
                                /\D/g,
                                ""
                            );


                        /*
                         * Ограничение длины.
                         */

                        if (
                            input.value.length >
                            maxDigits
                        ) {

                            input.value =
                                input.value.slice(
                                    0,
                                    maxDigits
                                );
                        }


                        /*
                         * Пока поле не пустое —
                         * обновляем отображение.
                         */

                        if (
                            input.value !== ""
                        ) {

                            remaining =
                                getInputDuration();

                            updateDisplay();
                        }
                    }
                );


                input.addEventListener(
                    "blur",
                    () => {

                        normalizeInput(input);


                        if (endTime !== null) {
                            return;
                        }


                        remaining =
                            getInputDuration();

                        updateDisplay();
                    }
                );


                input.addEventListener(
                    "change",
                    () => {

                        normalizeInput(input);


                        if (endTime !== null) {
                            return;
                        }


                        remaining =
                            getInputDuration();

                        updateDisplay();
                    }
                );
            }
        );


        /* ==================================================
           КНОПКИ
           ================================================== */

        startButton.addEventListener(
            "click",
            startTimer
        );


        pauseButton.addEventListener(
            "click",
            pauseTimer
        );


        resetButton.addEventListener(
            "click",
            resetTimer
        );


        addSecondsButton.addEventListener(
            "click",
            addTenSeconds
        );


        dismissAlarmButton.addEventListener(
            "click",
            finishAlarm
        );


        /* ==================================================
           КЛАВИАТУРА
           ================================================== */

        document.addEventListener(
            "keydown",
            event => {

                const isTypingInInput =
                    document.activeElement.tagName ===
                    "INPUT";


                /*
                 * ------------------------------------------
                 * АКТИВЕН ALARM
                 * ------------------------------------------
                 */

                if (isAlarmActive) {

                    if (
                        event.code === "Space" ||
                        event.code === "Enter" ||
                        event.code === "Escape"
                    ) {

                        /*
                         * Важно:
                         *
                         * не позволяем Space / Enter
                         * активировать focused-кнопку
                         * дополнительно.
                         */

                        event.preventDefault();
                        event.stopPropagation();

                        finishAlarm();

                        return;
                    }


                    return;
                }


                /*
                 * ------------------------------------------
                 * SPACE
                 *
                 * В обычном состоянии =
                 * новый запуск таймера.
                 * ------------------------------------------
                 */

                if (
                    event.code === "Space" &&
                    !isTypingInInput
                ) {

                    event.preventDefault();

                    startTimer();

                    return;
                }
            }
        );


        /*
         * Дополнительная защита от повторной
         * активации focused-кнопок через Space.
         */

        document.addEventListener(
            "keyup",
            event => {

                if (
                    isAlarmActive &&
                    (
                        event.code === "Space" ||
                        event.code === "Enter"
                    )
                ) {

                    event.preventDefault();
                }
            }
        );


        /* ==================================================
           ВОЗВРАТ ВО ВКЛАДКУ
           ================================================== */

        document.addEventListener(
            "visibilitychange",
            () => {

                if (
                    document.visibilityState ===
                    "visible"
                ) {

                    updateTimer();


                    if (
                        endTime !== null
                    ) {

                        acquireWakeLock();
                    }
                }
            }
        );


        /* ==================================================
           WORKER MESSAGE
           ================================================== */

        if (ticker) {

            ticker.onmessage =
                event => {

                    if (
                        event.data ===
                        "tick"
                    ) {

                        updateTimer();
                    }


                    if (
                        event.data ===
                        "beep"
                    ) {

                        /*
                         * Дополнительная страховка:
                         * после полного завершения сигнал
                         * никогда не должен прозвучать.
                         */

                        if (isAlarmActive) {
                            playAlarmSound();
                        }
                    }
                };
        }


        /* ==================================================
           НАЧАЛЬНОЕ СОСТОЯНИЕ
           ================================================== */

        remaining =
            getInputDuration();

        createTemplates();

        updateDisplay();

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                () => {

                    navigator.serviceWorker.register(
                        "./sw.js"
                    );

                }
            );

        }

    </script>
